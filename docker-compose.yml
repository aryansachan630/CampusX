version: '3.8'

services:
  campusx-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusx-production
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
